<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>我的抖音主页</title>
<style>
:root{
  --red:#c81f4b; --red2:#ff4d6d; --gold:#e8c07d; --gold2:#c9a25a;
  --bg1:#100512; --bg2:#1e0a1c; --bg3:#2c0d22;
  --card:rgba(255,255,255,.06); --line:rgba(255,255,255,.14);
  --txt:#f7eef2; --sub:#c9aebd;
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{
  font-family:"PingFang SC","Microsoft YaHei","Segoe UI",sans-serif;
  color:var(--txt);
  background:linear-gradient(165deg,var(--bg1),var(--bg2) 50%,var(--bg3));
  background-attachment:fixed; min-height:100vh; overflow-x:hidden;
}
/* 水印区：更小 + 惊喜按钮 */
.wm{position:fixed; top:12px; left:14px; z-index:99; display:flex; align-items:center; gap:8px}
.watermark{
  font-size:11px; letter-spacing:1px; color:rgba(255,255,255,.55);
  border:1px solid rgba(255,107,157,.45); border-radius:6px; padding:2px 8px;
  background:rgba(0,0,0,.25); backdrop-filter:blur(3px); pointer-events:none; transform:rotate(-6deg);
}
.surprise{
  font-size:11px; letter-spacing:1px; color:#ffd97a; text-decoration:none;
  border:1px solid rgba(255,217,122,.55); border-radius:6px; padding:2px 8px;
  background:rgba(0,0,0,.25); backdrop-filter:blur(3px); cursor:pointer;
  animation:glow 1.6s ease-in-out infinite;
}
.surprise:hover{color:#fff; background:rgba(255,217,122,.28)}
.egg-mini{font-size:11px; letter-spacing:1px; color:#ffb3c8; text-decoration:none;
  border:1px solid rgba(255,107,157,.55); border-radius:6px; padding:2px 8px;
  background:rgba(0,0,0,.25); backdrop-filter:blur(3px); cursor:pointer; transition:.2s}
.egg-mini:hover{color:#fff; background:rgba(255,107,157,.3)}
@keyframes glow{0%,100%{box-shadow:0 0 0 rgba(255,217,122,0)}50%{box-shadow:0 0 16px rgba(255,217,122,.65)}}
.back{
  position:fixed; top:12px; right:14px; z-index:99;
  color:var(--sub); text-decoration:none; font-size:13px;
  border:1px solid var(--line); border-radius:999px; padding:6px 15px;
  background:rgba(0,0,0,.28); transition:.2s;
}
.back:hover{color:#fff; border-color:var(--red2); background:rgba(255,77,109,.2)}
.wrap{max-width:1060px; margin:0 auto; padding:76px 22px 90px;}
h1{font-size:clamp(30px,6vw,54px); font-weight:800; letter-spacing:4px; text-align:center;
  background:linear-gradient(100deg,#fff,var(--red2) 40%,var(--gold) 75%,#fff);
  -webkit-background-clip:text; background-clip:text; -webkit-text-fill-color:transparent;}
.sub{text-align:center; color:var(--sub); margin-top:14px; letter-spacing:3px; font-size:14px; line-height:1.9}

/* 彩蛋触发器 */
.egg-trigger{display:block; margin:8px auto 0; cursor:pointer;
  border:1.5px dashed rgba(232,192,125,.7); background:rgba(232,192,125,.08);
  color:var(--gold); font-size:20px; letter-spacing:14px; padding:14px 0 14px 14px;
  border-radius:16px; text-align:center; width:100%; font-weight:700; transition:.25s; font-family:inherit}
.egg-trigger:hover{background:rgba(232,192,125,.16); box-shadow:0 0 26px rgba(232,192,125,.25)}
.egg-panel{display:none; margin-top:18px}
.egg-panel.show{display:grid; grid-template-columns:repeat(auto-fit,minmax(200px,1fr)); gap:14px; animation:rise .45s ease}

/* 首页导航卡片 */
.nav{display:grid; grid-template-columns:repeat(auto-fill,minmax(215px,1fr)); gap:16px; margin-top:30px}
.card{position:relative; display:block; background:var(--card); border:1px solid var(--line);
  border-radius:18px; padding:26px 20px; text-decoration:none; color:var(--txt);
  transition:transform .22s,box-shadow .22s,border-color .22s; text-align:center}
.card:hover{transform:translateY(-6px); border-color:rgba(255,77,109,.6); box-shadow:0 18px 40px rgba(0,0,0,.5)}
.card .ic{font-size:40px; display:block; margin-bottom:12px}
.card b{font-size:17px; letter-spacing:2px}
.card span{display:block; margin-top:6px; font-size:12.5px; color:var(--sub)}

/* 蛋卡片 */
.egg-card{background:linear-gradient(160deg,rgba(255,107,157,.16),rgba(245,192,75,.12));
  border:1px solid rgba(232,192,125,.5); border-radius:18px; padding:20px;
  text-align:center; text-decoration:none; color:var(--txt); transition:.22s}
.egg-card:hover{transform:translateY(-5px); box-shadow:0 0 30px rgba(255,107,157,.3)}
.egg-card .ic{font-size:34px; display:block; margin-bottom:8px}
.egg-card b{font-size:16px; color:var(--gold)}

/* 表情包展示 */
.sticker-row{display:flex; flex-wrap:wrap; gap:20px; justify-content:center; margin-top:26px}
.sticker-row a{text-decoration:none}
.sticker-row figure{background:rgba(255,255,255,.05); border:1px solid var(--line); border-radius:18px; padding:14px; transition:.22s}
.sticker-row figure:hover{transform:translateY(-6px) scale(1.03); border-color:rgba(255,77,109,.6)}
.sticker-row img{display:block; width:210px; height:210px; object-fit:contain; border-radius:10px}
.sticker-row figcaption{text-align:center; margin-top:8px; color:var(--sub); font-size:12.5px; letter-spacing:2px}

/* 图片墙（照片与声音） */
.gallery{display:grid; grid-template-columns:repeat(auto-fill,minmax(240px,1fr)); gap:14px; margin-top:20px}
.gallery figure{background:var(--card); border:1px solid var(--line); border-radius:14px; overflow:hidden}
.gallery img{display:block; width:100%; height:240px; object-fit:cover; cursor:zoom-in}
.gallery figcaption{padding:9px 13px; font-size:12.5px; color:var(--sub)}
.track{margin-top:14px; background:var(--card); border:1px solid var(--line); border-radius:14px; padding:15px 18px}
.track b{font-size:15px}
.track p{font-size:12.5px; color:var(--sub); margin:4px 0 10px}
audio{width:100%; height:40px; filter:invert(.9) hue-rotate(180deg) saturate(1.4)}

/* 标题/按钮 */
.egg-title{font-size:clamp(22px,4.5vw,34px); font-weight:800; text-align:center; letter-spacing:3px; margin:18px 0 6px; color:var(--gold)}
.egg-desc{text-align:center; color:var(--sub); line-height:2; margin-bottom:26px; font-size:15px}
.btn{display:inline-block; padding:12px 28px; border-radius:999px; text-decoration:none;
  background:linear-gradient(90deg,var(--red2),var(--gold2)); color:#1a0410; font-weight:700;
  letter-spacing:2px; transition:.2s; font-size:15px}
.btn:hover{transform:translateY(-3px); box-shadow:0 12px 30px rgba(255,77,109,.4)}
.center{text-align:center}

/* 开启彩蛋的全屏遮罩 */
.gate{position:fixed; inset:0; z-index:200; background:radial-gradient(circle at 50% 40%,#2a0f26,#0c030a);
  display:flex; flex-direction:column; align-items:center; justify-content:center; cursor:pointer;
  text-align:center; transition:opacity .6s ease}
.gate .box{font-size:64px; animation:bounce 1.4s ease-in-out infinite}
.gate h2{font-size:26px; letter-spacing:6px; color:var(--gold); margin-top:16px}
.gate p{color:var(--sub); margin-top:12px; letter-spacing:3px; font-size:14px}
.gate.hide{opacity:0; pointer-events:none}

@keyframes bounce{0%,100%{transform:translateY(0)}50%{transform:translateY(-18px)}}
@keyframes rise{from{opacity:0; transform:translateY(20px)}to{opacity:1; transform:translateY(0)}}
@keyframes pop{0%{opacity:0; transform:scale(.3)}70%{transform:scale(1.1)}100%{opacity:1; transform:scale(1)}}
.pop{animation:pop .5s cubic-bezier(.2,1.4,.4,1) both}

/* 彼岸花飘落 */
@keyframes bfall{
  0%{transform:translateY(-10vh) rotate(0deg)}
  25%{transform:translateY(20vh) translateX(16px) rotate(90deg)}
  50%{transform:translateY(48vh) translateX(-12px) rotate(180deg)}
  75%{transform:translateY(74vh) translateX(14px) rotate(270deg)}
  100%{transform:translateY(112vh) translateX(-8px) rotate(360deg)}
}

@media(max-width:560px){
  .sticker-row img{width:150px; height:150px}
  .gallery img{height:190px}
}

/* ===== 主页照片与声音 ===== */
h2{font-size:22px; margin:46px 0 6px; display:flex; align-items:center; gap:12px; letter-spacing:2px}
h2::before{content:""; width:5px; height:22px; border-radius:3px; background:linear-gradient(var(--red2),var(--gold))}
.hint{color:var(--sub); font-size:13px; margin:0 0 18px 17px; line-height:1.8}
.hero{text-align:center; padding:18px 0 4px}
.en{font-size:12px; letter-spacing:6px; color:var(--gold2); text-transform:uppercase}
.jp{color:var(--sub); letter-spacing:4px; font-size:14px; margin-top:6px}
.quote{margin:20px auto 0; max-width:640px; font-size:15px; line-height:1.9; color:#f0dde6;
  border-left:2px solid var(--red); padding:2px 0 2px 16px; text-align:left}
.quote span{color:var(--gold)}
.tags{display:flex; gap:9px; justify-content:center; flex-wrap:wrap; margin-top:18px}
.tag{font-size:12px; padding:5px 13px; border-radius:999px; border:1px solid var(--line);
  color:var(--sub); background:rgba(255,255,255,.035)}
.info{display:grid; grid-template-columns:repeat(auto-fill,minmax(210px,1fr)); gap:11px; margin-top:16px}
.info div{background:var(--card); border:1px solid var(--line); border-radius:13px; padding:12px 15px}
.info b{display:block; font-size:11px; color:var(--gold2); letter-spacing:2px; font-weight:600; margin-bottom:4px}
.info span{font-size:14.5px}
.gallery figure.contain img{object-fit:contain; background:#0a0308}
.grp{margin:28px 0 0; font-size:15px; color:var(--gold); letter-spacing:3px; font-weight:600;
  display:flex; align-items:center; gap:10px}
.grp::before{content:"♪"; color:var(--red2); font-size:17px}
.grp small{font-size:12px; color:var(--sub); letter-spacing:1px; font-weight:400}
.notice{margin-top:20px; border:1px dashed rgba(232,192,125,.45); background:rgba(232,192,125,.07);
  border-radius:14px; padding:14px 18px; font-size:13px; line-height:1.85; color:#e9d9c0}
.links{display:grid; grid-template-columns:repeat(auto-fill,minmax(270px,1fr)); gap:11px; margin-top:6px}
.links a{display:block; background:var(--card); border:1px solid var(--line); border-radius:13px;
  padding:14px 17px; text-decoration:none; color:var(--txt); transition:.2s}
.links a:hover{border-color:var(--red2); background:rgba(255,77,109,.12); transform:translateX(4px)}
.links b{display:block; font-size:14.5px; margin-bottom:4px}
.links span{font-size:12px; color:var(--sub); word-break:break-all}

.gotop{position:fixed;right:22px;bottom:22px;z-index:90;width:48px;height:48px;border-radius:50%;border:1px solid var(--line);background:rgba(255,107,157,.25);color:#fff;font-size:20px;cursor:pointer;backdrop-filter:blur(6px);transition:.2s;box-shadow:0 8px 20px rgba(0,0,0,.4)}
.gotop:hover{background:var(--red2);transform:translateY(-3px)}
/* ==== 1314 按钮两侧的醒目方向键（两个箭头指向中间）==== */
.cta-row{display:flex; align-items:center; justify-content:center; gap:14px; flex-wrap:wrap}
.arrow{
  font-size:46px; line-height:1; color:var(--gold);
  text-shadow:0 0 18px rgba(255,217,122,.85), 0 0 38px rgba(255,77,109,.5);
  animation:toRight 1.1s ease-in-out infinite;
}
.arrow-r{animation-name:toLeft; transform:scaleX(-1)}
@keyframes toRight{
  0%,100%{transform:translateX(0)}
  50%{transform:translateX(13px)}
}
@keyframes toLeft{
  0%,100%{transform:scaleX(-1) translateX(0)}
  50%{transform:scaleX(-1) translateX(13px)}
}
@media(max-width:560px){ .arrow{font-size:30px} .cta-row{gap:8px} }

.topnav{display:flex; flex-wrap:wrap; gap:8px; justify-content:center; margin-bottom:12px}
.topnav a{color:var(--sub); text-decoration:none; font-size:13px; border:1px solid var(--line);
  border-radius:999px; padding:6px 16px; background:rgba(0,0,0,.25); transition:.2s}
.topnav a:hover{color:#fff; border-color:var(--red2); background:rgba(255,77,109,.2)}
.grid1314{display:grid; grid-template-columns:repeat(auto-fill,minmax(230px,1fr)); gap:14px; margin-top:16px}
.hcard{background:var(--card); border:1px solid var(--line); border-radius:16px; padding:16px 18px;
  display:flex; flex-direction:column; gap:10px; min-height:104px; backdrop-filter:blur(4px);
  transition:transform .25s, box-shadow .25s, background .25s}
.hcard:hover{transform:translateY(-5px); background:rgba(255,107,157,.10);
  box-shadow:0 14px 30px rgba(0,0,0,.35), 0 0 0 1px rgba(255,107,157,.35)}
.hcard .num{font-size:12px; color:var(--red2); font-weight:700; letter-spacing:1px}
.hcard .txt{font-size:15px; line-height:1.55}
.hcard.milestone{border-color:rgba(255,217,122,.5);
  background:linear-gradient(160deg,rgba(255,107,157,.14),rgba(245,192,75,.10))}
.hcard.milestone .num{color:var(--gold)}
.hcard.finale{grid-column:1/-1; text-align:center; justify-content:center; min-height:150px;
  border:2px solid var(--gold); background:linear-gradient(160deg,rgba(255,107,157,.20),rgba(245,192,75,.16));
  box-shadow:0 0 40px rgba(255,107,157,.35)}
.hcard.finale .num{font-size:16px}
.hcard.finale .txt{font-size:22px; font-weight:700}
@media(max-width:560px){ .grid1314{grid-template-columns:1fr 1fr} }

</style>
</head>

<script>
/* 彼岸花特效：飘落的红色彼岸花 + 角落静态彼岸花 */
(function(){
  var NS='http://www.w3.org/2000/svg';
  function spiderLily(size){
    var s=document.createElementNS(NS,'svg');
    s.setAttribute('viewBox','0 0 100 100');
    s.setAttribute('width',size); s.setAttribute('height',size);
    var petal='M50 50 C43 33 20 26 15 39 C11 51 30 53 50 50 Z';
    for(var i=0;i<6;i++){
      var p=document.createElementNS(NS,'path');
      p.setAttribute('d',petal); p.setAttribute('fill','#e0244a');
      p.setAttribute('transform','rotate('+(i*60)+' 50 50)'); s.appendChild(p);
    }
    for(var i=0;i<6;i++){
      var st=document.createElementNS(NS,'path');
      st.setAttribute('d','M50 50 Q56 22 74 14');
      st.setAttribute('stroke','#ff7b9a'); st.setAttribute('stroke-width','2.4');
      st.setAttribute('fill','none');
      st.setAttribute('transform','rotate('+(i*60)+' 50 50)'); s.appendChild(st);
    }
    var c=document.createElementNS(NS,'circle');
    c.setAttribute('cx','50'); c.setAttribute('cy','50'); c.setAttribute('r','4');
    c.setAttribute('fill','#ffd97a'); s.appendChild(c);
    return s;
  }
  function addStatic(pos,size,op){
    var w=document.createElement('div');
    w.appendChild(spiderLily(size));
    w.style.cssText='position:fixed;'+pos+';opacity:'+op+';pointer-events:none;z-index:0;';
    document.body.appendChild(w);
  }
  function addFalling(){
    var layer=document.createElement('div');
    layer.style.cssText='position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden';
    for(var i=0;i<15;i++){
      var w=document.createElement('div');
      var sz=20+Math.random()*36;
      w.appendChild(spiderLily(sz));
      w.style.cssText='position:absolute;top:-12%;left:'+(Math.random()*100).toFixed(1)+'%;'+
        'opacity:'+(0.45+Math.random()*0.4).toFixed(2)+';'+
        'animation:bfall '+(10+Math.random()*12).toFixed(1)+'s linear '+(Math.random()*14).toFixed(1)+'s infinite;';
      layer.appendChild(w);
    }
    document.body.appendChild(layer);
  }
  function boot(){
    addFalling();
    addStatic('bottom:16px;right:16px;',72,0.5);
    addStatic('bottom:20px;left:16px;',46,0.35);
  }
  if(document.readyState==='loading'){document.addEventListener('DOMContentLoaded',boot);}else{boot();}
})();

</script>
